name: dbt_compilation_check

# Se ejecuta cada vez que haces un push a cualquier rama
on:
  push:
    branches:
      - '**'

jobs:
  compilar_codigo:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dbt-bigquery
        run: |
          pip install dbt-bigquery

      - name: Compilar modelos de dbt
        # Compilamos para verificar sintaxis Jinja/SQL sin conectarnos a la base de datos real aún
        run: |
          dbt deps
          dbt compile